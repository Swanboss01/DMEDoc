[project]
name = "dmedoc"
version = "0.3.0"
description = "MS42 (BMW) read-only diagnostics - PREVIEW"
requires-python = ">=3.9"
dependencies = ["pyserial"]

[project.scripts]
dmedoc = "dmedoc.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dmedoc"]
